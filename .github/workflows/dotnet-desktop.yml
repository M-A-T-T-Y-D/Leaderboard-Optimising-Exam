name: .NET Core Build and Test

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore './Leaderboard.slnx'

      - name: Build solution
        run: dotnet build './Leaderboard.slnx' --configuration ${{ matrix.configuration }} --no-restore

      - name: Run unit tests
        run: dotnet test './Leaderboard.Tests/Leaderboard.Tests.csproj' --configuration ${{ matrix.configuration }} --no-build
